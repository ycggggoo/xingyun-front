name: Master Push - Build & Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    uses: ycggggoo/.github/.github/workflows/frontend-node-ci.yml@master
    with:
      image-name: ycggggoo/xingyun-web
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            IMAGE=ghcr.io/ycggggoo/xingyun-web
            TAG=${{ github.sha }}
            DIR=/data/xingyun-erp

            echo "=== Pull image: ${IMAGE}:${TAG} ==="
            docker pull ${IMAGE}:${TAG}

            echo "=== Tag as :local ==="
            docker tag ${IMAGE}:${TAG} ${IMAGE}:local

            echo "=== Redeploy ==="
            cd ${DIR}
            docker compose -f docker-compose.app.yml up -d --force-recreate xingyun-web

            echo "=== Health check ==="
            for i in 1 2 3 4 5; do
              if curl -sf -m 5 http://localhost:80/; then
                echo "OK"
                exit 0
              fi
              echo "Waiting... ($i/5)"
              sleep 10
            done
            echo "FAILED"
            exit 1
